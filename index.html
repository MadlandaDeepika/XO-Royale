<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Voice AI Assistant</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: var(--card);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 500px;
      text-align: center;
    }
    h1 { margin-bottom: 0.5rem; color: var(--accent); }
    p { color: #94a3b8; font-size: 0.95rem; }
    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0.8rem 1.8rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 2rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover { transform: scale(1.05); background: #7dd3fc; }
    .btn.listening { background: #ef4444; color: white; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .output-box {
      margin-top: 1.5rem;
      background: #0f172a;
      padding: 1rem;
      border-radius: 0.5rem;
      min-height: 80px;
      text-align: left;
      border: 1px solid #334155;
    }
    .label { font-size: 0.8rem; color: #64748b; font-weight: bold; text-transform: uppercase; }
    .text { margin-top: 0.25rem; font-size: 1rem; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Offline Voice AI</h1>
    <p>Runs 100% locally in your browser using Web Speech APIs.</p>
    
    <button id="micBtn" class="btn" onclick="toggleListening()">🎤 Start Listening</button>

    <div class="output-box">
      <div class="label">You Said:</div>
      <div id="userInput" class="text">Click the button and speak...</div>
    </div>

    <div class="output-box">
      <div class="label">AI Response:</div>
      <div id="aiResponse" class="text">Waiting for input...</div>
    </div>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const userInput = document.getElementById('userInput');
    const aiResponse = document.getElementById('aiResponse');

    // Check browser support
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.textContent = '🛑 Listening...';
        micBtn.classList.add('listening');
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.textContent = '🎤 Start Listening';
        micBtn.classList.remove('listening');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.textContent = transcript;
        processQuery(transcript.toLowerCase());
      };
    } else {
      alert("Speech Recognition is not supported on this browser. Try Chrome or Edge.");
    }

    function toggleListening() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    // Offline Command Processing Engine
    function processQuery(query) {
      let reply = "I heard you, but I don't have an offline rule for that query yet.";

      if (query.includes('hello') || query.includes('hi')) {
        reply = "Hello! I am your offline browser AI assistant.";
      } else if (query.includes('time')) {
        reply = `The current time is ${new Date().toLocaleTimeString()}`;
      } else if (query.includes('date')) {
        reply = `Today is ${new Date().toLocaleDateString()}`;
      } else if (query.includes('who are you')) {
        reply = "I am a lightweight client-side AI powered by JavaScript.";
      } else if (query.includes('data science')) {
        reply = "Data science is about discovering patterns in data using statistics and algorithms!";
      }

      aiResponse.textContent = reply;
      speak(reply);
    }

    // Local Text-to-Speech
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop ongoing speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1;
        utterance.pitch = 1;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
